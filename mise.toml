[settings]
lockfile = true
lockfile_mode = "generate"
locked = true
minimum_release_age = "7d"

[tools]
hk = { version = "2.2.0", postinstall = "hk install --mise" }
betterleaks = "1.8.1"
cocogitto = "7.0.0"
actionlint = "1.7.12"
zizmor = "1.30.1"
node = "22.23.3"
npm = "11.20.0"

[env]
_.path = ["{{config_root}}/node_modules/.bin"]

[shell_alias]
"pi:local" = "pi --no-extensions -e {{config_root}}"
"pi:npm" = "pi --no-extensions -e npm:pi-researcher"

[tasks.check]
description = "Run all non-writing project checks"
run = ["npm run check", "npm test", "npm run pack:dry"]

[tasks."test:live"]
description = "Verify the packaged extension through Pi 1.0.0 and live Codex"
run = '''
# Bind the token lookup and the test process to the repository's Pi dependency. The CLI
# subprocess binds PI_PACKAGE_DIR to the selected executable itself.
export PI_PACKAGE_DIR="$PWD/node_modules/@earendil-works/pi-coding-agent"
PI_RESEARCHER_LIVE_API_KEY="$(./node_modules/.bin/pi auth print-bearer-token --provider openai-codex --model gpt-5.6-luna)" \
  npm run test:live
'''
